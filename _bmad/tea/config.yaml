# TEA Module Configuration
# Hand-created for Overlearn (no BMad installer has run in this project;
# schema follows the standard BMad Method v6 config shape).
#
# Overlearn is fully offline React Native/Expo with a Jest + React Native
# Testing Library suite — no browser, no network layer, no contract testing.
# Values below reflect that; fields with no confident answer are left "auto"
# rather than guessed.

test_artifacts: "{project-root}/_bmad-output/test-artifacts"
tea_use_playwright_utils: false
tea_use_mcp_enhancements: false
test_framework: jest
risk_threshold: p2
test_design_output: _bmad-output/test-artifacts/test-design
test_review_output: _bmad-output/test-artifacts/test-reviews
trace_output: _bmad-output/test-artifacts/traceability
tea_use_pactjs_utils: false
tea_pact_mcp: none
tea_browser_automation: none
tea_execution_mode: auto
tea_capability_probe: true
test_stack_type: auto
ci_platform: auto

# Core Configuration Values
user_name: Gerardo
communication_language: English
document_output_language: English
output_folder: "{project-root}/_bmad-output"
